# Task 19: the metrics API as a second service from the same GitHub repository (Render blueprint).
services:
  - type: web
    name: pulseiq-metrics-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
